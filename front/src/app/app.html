<main>
  <h1>Livre d'or</h1>

  <form (ngSubmit)="send()">
    <input
      name="content"
      [ngModel]="content()"
      (ngModelChange)="content.set($event)"
      placeholder="Ton message"
    />
    <button type="submit">Envoyer</button>
  </form>

  <ul>
    @for (m of messages(); track m.id) {
      <li>{{ m.content }} - <small>{{ m.createdAt }}</small></li>
    } @empty {
      <li>Aucun message pour l'instant.</li>
    }
  </ul>
</main>

name: demo

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER manquant dans .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: ${DB_NAME:?DB_NAME manquant dans .env}
    secrets:
      - db_admin_password
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/demo-back:${APP_VERSION:-latest}
    command: ["node", "dist/migrate.js"]
    profiles: ["tools"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD_FILE: /run/secrets/db_admin_password
      DB_USER: app_runtime
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_admin_password
      - db_app_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  back:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/demo-back:${APP_VERSION:-latest}
    build: ./back
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: app_runtime
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_app_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  front:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/demo-front:${APP_VERSION:-latest}
    build: ./front
    restart: unless-stopped
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      back:
        condition: service_healthy
      front:
        condition: service_healthy
    networks:
      - frontend

secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_app_password:
    file: ./secrets/db_app_password

networks:
  frontend:
  backend:
    internal: true

volumes:
  db-data:

name: demo

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:?DB_ADMIN_USER manquant dans .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_DB: ${DB_NAME:?DB_NAME manquant dans .env}
    secrets:
      - db_admin_password
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/demo-back:${APP_VERSION:-latest}
    command: ["node", "dist/migrate.js"]
    profiles: ["tools"]
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
      DB_ADMIN_PASSWORD_FILE: /run/secrets/db_admin_password
      DB_USER: app_runtime
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_admin_password
      - db_app_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  back:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/demo-back:${APP_VERSION:-latest}
    build: ./back
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: app_runtime
      DB_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - db_app_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - edge
    labels:
      - traefik.enable=true
      - "traefik.http.routers.demo-api.rule=Host(`${APP_HOST:?APP_HOST manquant}`) && (Path(`/graphql`) || Path(`/health`))"
      - traefik.http.routers.demo-api.entrypoints=websecure
      - traefik.http.routers.demo-api.tls=true
      - traefik.http.routers.demo-api.middlewares=security-headers@file,graphql-ratelimit@file
      - traefik.http.services.demo-api.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  front:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant dans .env}/demo-front:${APP_VERSION:-latest}
    build: ./front
    restart: unless-stopped
    networks:
      - edge
    labels:
      - traefik.enable=true
      - "traefik.http.routers.demo-web.rule=Host(`${APP_HOST:?APP_HOST manquant}`)"
      - traefik.http.routers.demo-web.entrypoints=websecure
      - traefik.http.routers.demo-web.tls=true
      - traefik.http.routers.demo-web.middlewares=security-headers@file
      - traefik.http.services.demo-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

secrets:
  db_admin_password:
    file: ./secrets/db_admin_password
  db_app_password:
    file: ./secrets/db_app_password

networks:
  backend:
    internal: true
  edge:
    external: true

volumes:
  db-data:
